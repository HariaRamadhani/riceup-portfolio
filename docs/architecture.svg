<svg width="680" height="460" viewBox="0 0 680 460" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Arsitektur cloud RiceUp</title>
<desc>Android app memanggil REST API di Cloud Run, yang terhubung ke Firebase sebagai database utama dan Cloud Storage untuk dataset/model. Perubahan dataset di Cloud Storage memicu Pub/Sub, yang men-trigger Cloud Function untuk melatih ulang model dan menyimpan hasilnya kembali ke Cloud Storage.</desc>
