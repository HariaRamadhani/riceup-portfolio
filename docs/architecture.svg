<text x="340" y="50" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#0C447C">Android app</text>
<text x="340" y="68" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="12" fill="#185FA5">Kotlin + Retrofit</text>

<line x1="340" y1="86" x2="340" y2="114" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>
<text x="356" y="102" font-family="Arial, sans-serif" font-size="12" fill="#5F5E5A">REST call</text>

