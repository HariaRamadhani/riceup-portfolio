<text x="340" y="154" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="12" fill="#0F6E56">REST API (deteksi + prediksi)</text>

<line x1="290" y1="172" x2="150" y2="220" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>
<line x1="390" y1="172" x2="530" y2="220" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>

<rect x="40" y="222" width="180" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
