<text x="550" y="242" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#085041">Cloud Storage</text>
<text x="550" y="260" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="12" fill="#0F6E56">Dataset &amp; model tersimpan</text>

<line x1="550" y1="278" x2="550" y2="306" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>
